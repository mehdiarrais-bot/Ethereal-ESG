version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # Noms d'hôte sous lesquels l'application est servie (protection contre
      # le rebinding DNS). Ajouter ici le nom ou l'IP du serveur si besoin.
      ESG_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
