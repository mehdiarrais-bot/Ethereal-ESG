name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt -r backend/requirements-dev.txt pyinstaller==6.22.3

      - name: Tests backend (sur le code source)
        working-directory: backend
        run: python -m pytest tests -q

      - name: Construction de l'executable
        run: pyinstaller packaging/ethereal_esg.spec --noconfirm

      - name: Test de fumee (sur l'executable reel)
        run: python packaging/smoke_test.py dist/EtherealESG/EtherealESG.exe

      - name: Archive zip
        shell: pwsh
        run: Compress-Archive -Path dist/EtherealESG -DestinationPath EtherealESG-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EtherealESG-windows
          path: EtherealESG-windows.zip
          retention-days: 30
