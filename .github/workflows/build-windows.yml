name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Création de la Release (tag v*) : droit d'écriture sur le contenu du dépôt.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt -r backend/requirements-dev.txt -r packaging/requirements-desktop.txt

      - name: Tests backend (sur le code source)
        working-directory: backend
        run: python -m pytest tests -q -n auto

      - name: Construction de l'executable
        run: pyinstaller packaging/ethereal_esg.spec --noconfirm

      - name: Test de fumee (sur l'executable reel)
        run: python packaging/smoke_test.py dist/EtherealESG.exe

      # Un seul fichier : EtherealESG.exe (double-clic -> fenêtre de l'application).
      - uses: actions/upload-artifact@v4
        with:
          name: EtherealESG-windows
          path: dist/EtherealESG.exe
          retention-days: 30

      # Tag v* : Release publique et permanente, l'exe en pièce jointe
      # (téléchargeable sans compte GitHub, contrairement à l'artefact).
      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" dist/EtherealESG.exe
          --title "Ethereal ESG $env:GITHUB_REF_NAME"
          --notes "Télécharger EtherealESG.exe puis double-cliquer : l'application s'ouvre dans sa propre fenêtre (Windows 10/11). Exécutable non signé : au premier lancement, SmartScreen -> « Informations complémentaires » -> « Exécuter quand même »."
